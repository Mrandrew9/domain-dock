name: Extension checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and run offline unit tests
        run: npm run check
      - name: Verify manifest JSON
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version !== 3 || m.host_permissions) process.exit(1)"
      - name: Verify manifest and package versions match
        run: node -e "const m=require('./manifest.json'), p=require('./package.json'); if(m.version !== p.version) { console.error('manifest', m.version, '!= package', p.version); process.exit(1) }"
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies (Playwright only)
        run: npm ci
      - name: Install Chromium for testing
        run: npx playwright install --with-deps chromium
      - name: Run the extension in Chromium and test it end to end
        run: npm run test:browser
