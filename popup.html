<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DomainDock — Tab Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="branding"><div class="logo" aria-hidden="true">D</div>
        <div><h1>DomainDock</h1><p>Tab space, reclaimed.</p></div>
      </div>
      <button id="settings" class="icon-button" type="button" title="Settings" aria-label="Open settings">⚙</button>
    </header>

    <section class="stats" aria-live="polite">
      <div><strong id="tabCount">—</strong><span>open tabs</span></div>
      <div><strong id="siteCount">—</strong><span>websites</span></div>
      <div><strong id="taggedCount">—</strong><span>labeled tabs</span></div>
    </section>

    <section class="search-area">
      <label for="search" class="sr-only">Search tabs, labels, or tags</label>
      <div class="search-input"><span aria-hidden="true">⌕</span><input id="search" aria-describedby="searchKeys" autofocus autocomplete="off" placeholder="Search tabs, labels, #tags…"><kbd>/</kbd></div>
      <p id="searchKeys" class="search-keys"><kbd>↑</kbd> <kbd>↓</kbd> Move <kbd>Enter</kbd> Switch tab</p>
      <span id="keyboardStatus" class="sr-only" role="status"></span>
      <div class="filters">
        <label class="check"><input id="allWindows" type="checkbox" checked> All windows</label>
        <label class="check"><input id="autoGroup" type="checkbox"> Auto-group</label>
      </div>
    </section>

    <nav class="view-tabs" aria-label="Tab views">
      <button id="showAll" class="view-tab active" type="button" aria-pressed="true">All tabs</button>
      <button id="showDuplicates" class="view-tab" type="button" aria-pressed="false">Duplicates <span id="duplicateCount" class="duplicate-badge">0</span></button>
    </nav>

    <div class="toolbar">
      <div><h2 id="resultsTitle">Your tabs</h2><small id="status" role="status"></small></div>
      <button id="topic" class="secondary" type="button">Review &amp; focus</button>
      <button id="groupNow" class="primary" type="button">Group now</button>
    </div>
    <div id="duplicateActions" class="duplicate-actions" hidden>
      <p>Exact URL matches only. Active, pinned and audio-playing tabs are protected. Nothing closes automatically.</p>
      <div class="duplicate-buttons">
        <button id="selectExtras" class="secondary" type="button">Select same-window extras</button>
        <button id="closeDuplicates" class="danger-button" type="button" disabled>Close selected (0)</button>
      </div>
    </div>

    <section id="results" class="results" aria-label="Matching tabs" aria-live="polite"></section>
    <footer>Labels and tags stay on this device. <span id="footerNote">No accounts. No tracking.</span></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
